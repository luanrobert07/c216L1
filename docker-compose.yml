services:
  db:
    image: postgres:16
    container_name: postgres-alunos
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alunos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alunos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api-alunos
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alunos_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  tests:
    build: .
    container_name: testes-api-alunos
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alunos_db
    depends_on:
      db:
        condition: service_healthy
    command: pytest -v

volumes:
  postgres_data:
