services:
  api:
    build: .
    container_name: api-alunos
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:5000/', timeout=2).raise_for_status()",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  testes:
    build: .
    container_name: api-alunos-testes
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_URL: http://api:5000
    command: ["pytest", "-v", "tests/test_api.py"]
